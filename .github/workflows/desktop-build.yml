name: Build desktop (Windows)

# Windows 版（Electron）のインストーラーを作る（自動アップデート用の latest.yml 付き）。
#  - main に、desktop/ か web/ の変更が入ったら自動で作る（成果物は Artifacts と、固定の「desktop-latest」リリース）
#  - 手動実行（workflow_dispatch）、または desktop-v* のタグでも動く（タグのときは、そのタグのリリースにも付ける）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      # 版番号は 0.1.<実行番号>（ビルドごとに増える）。自動アップデートは、この番号の大小で新しい版かを決める
      - name: Build Windows app
        working-directory: desktop
        run: |
          npm ci
          npm version 0.1.${{ github.run_number }} --no-git-tag-version
          npx electron-builder --win --publish never

      - name: Show sizes
        shell: pwsh
        run: Get-ChildItem desktop/release/*.exe, desktop/release/latest.yml, desktop/release/*.blockmap | ForEach-Object { '{0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: InkGraph-windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      # 固定のリリース「desktop-latest」を、毎回最新のビルドで作り直す（いつも同じ URL から最新版を取れる）
      - name: Update rolling release (desktop-latest)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --cleanup-tag --yes || true
          gh release create desktop-latest desktop/release/*.exe desktop/release/latest.yml desktop/release/*.blockmap --target "$GITHUB_SHA" --prerelease \
            --title "InkGraph デスクトップ版（最新）" \
            --notes "main の $GITHUB_SHA から自動で作った Windows 版です。インストーラー（InkGraph-…-win-x64.exe）です。一度入れれば、以後は新しい版をアプリが見つけて更新します（latest.yml はそのための情報）。コード署名はしていないので、初回は「詳細情報」→「実行」を選んでください。"

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
